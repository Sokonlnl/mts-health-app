name: HealthMonitor
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode; компилятор Swift 5.10+ (Xcode 15.3+)
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HealthMonitor:
    type: application
    platform: iOS
    sources:
      - path: HealthMonitor
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthmonitor
        PRODUCT_NAME: HealthMonitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Health Monitor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  HealthMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMonitorTests
    dependencies:
      - target: HealthMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthmonitor.tests
        GENERATE_INFOPLIST_FILE: YES

  HealthMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthMonitorUITests
    dependencies:
      - target: HealthMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthmonitor.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthMonitor

schemes:
  HealthMonitor:
    build:
      targets:
        HealthMonitor: all
    test:
      targets:
        - HealthMonitorTests
        - HealthMonitorUITests
      gatherCoverageData: true
    run:
      config: Debug
