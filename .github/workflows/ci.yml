name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint --strict

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select simulator
        id: sim
        run: |
          # Берём первый доступный iPhone-симулятор по UDID (не зависит от версии образа)
          UDID=$(xcrun simctl list devices available iPhone | grep -E 'iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build and test (with simulator video)
        run: |
          mkdir -p build/video
          # Видео всего прогона: UI-тесты, скриншоты, аудит доступности.
          xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force build/video/ui-tests.mp4 &
          REC_PID=$!
          set +e
          xcodebuild test \
            -project HealthMonitor.xcodeproj \
            -scheme HealthMonitor \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          kill -INT "$REC_PID" 2>/dev/null
          wait "$REC_PID" 2>/dev/null
          exit $STATUS

      - name: Upload simulator video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-video
          path: build/video/ui-tests.mp4
          if-no-files-found: warn

      - name: Upload snapshot references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Новые эталоны, записанные в этом прогоне (режим .missing), для просмотра и коммита.
          name: snapshots
          path: HealthMonitorTests/__Snapshots__
          if-no-files-found: ignore

      - name: Package simulator app
        if: always()
        continue-on-error: true
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/HealthMonitor.app
          if [ -d "$APP" ]; then
            mkdir -p build/app
            ditto -c -k --sequesterRsrc --keepParent "$APP" build/app/HealthMonitor-simulator.zip
          fi

      - name: Upload simulator app (for Appetize)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: build/app/HealthMonitor-simulator.zip
          if-no-files-found: warn

      - name: Export screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build/screenshots
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/TestResults.xcresult \
              --output-path build/screenshots
          fi

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
